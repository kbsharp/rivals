<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Play Store icon: the launcher icon's 8-ball on felt, full bleed (Play applies the mask). -->
  <defs>
    <radialGradient id="felt" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#128A63"/>
      <stop offset="1" stop-color="#0B6E4F"/>
    </radialGradient>
    <radialGradient id="shine" cx="38%" cy="32%" r="60%">
      <stop offset="0" stop-color="#3A3A3A"/>
      <stop offset="1" stop-color="#111111"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#felt)"/>
  <ellipse cx="262" cy="410" rx="150" ry="26" fill="#000" opacity="0.18"/>
  <circle cx="256" cy="256" r="170" fill="url(#shine)"/>
  <circle cx="256" cy="256" r="78" fill="#FFFFFF"/>
  <circle cx="256" cy="230.3" r="20.3" fill="none" stroke="#111111" stroke-width="13.3"/>
  <circle cx="256" cy="276.3" r="25.7" fill="none" stroke="#111111" stroke-width="13.3"/>
</svg>
