name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: google-services.json
        run: echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      - run: ./gradlew testDebugUnitTest lint assembleDebug
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports
          path: app/build/reports
      # Every screen and state, light and dark, rendered by the JVM screenshot tests.
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: app/build/screenshots

  rules:
    name: Firestore rules tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6  # the Firestore emulator is a jar
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: rules-test/package-lock.json
      - id: firebase
        run: |
          npm install -g firebase-tools
          echo "version=$(firebase --version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ steps.firebase.outputs.version }}
      - run: npm ci --no-audit --fund=false
        working-directory: rules-test
      - run: npm test
        working-directory: rules-test

  emulator:
    name: Sync tests (Android and Firebase emulators)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: rules-test/package-lock.json
      - id: firebase
        run: |
          npm install -g firebase-tools
          echo "version=$(firebase --version)" >> "$GITHUB_OUTPUT"
      # The Firestore emulator jar is downloaded on first use; keep it between runs.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ steps.firebase.outputs.version }}
      - name: google-services.json
        run: echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      - name: Free up disk space
        # The API 36 AVD needs ~7.4 GB for its userdata partition, and a stock runner with the
        # Gradle cache restored doesn't have that spare: the emulator dies on launch with
        # "Not enough space to create userdata partition". None of this is used by the build.
        run: |
          sudo rm -rf /usr/local/lib/android/sdk/ndk /usr/share/dotnet /opt/ghc \
            /usr/local/share/powershell /usr/share/swift /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          df -h /
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Compiled before the emulator starts: with it running, the build fights a software-rendered
      # phone for the runner's CPUs and takes twice as long. The test task below is then up to date.
      - name: Build the app and test APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          # Smaller than the 7.4 GB default partition, so a full-ish runner still boots.
          disk-size: 6G
          # Cold boot on purpose. A cached AVD snapshot (tried 2026-09-24) resumed in 45s, but
          # restoring its 4 GiB took 1.5 min and the tests ran no faster: the job was a minute slower.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: firebase emulators:exec --only auth,firestore "./gradlew connectedDebugAndroidTest"
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-reports
          path: app/build/reports/androidTests
